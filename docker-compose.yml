version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: req-traceability-neo4j
    ports:
      - "7484:7474"  # Neo4j Browser (extern 7484, intern 7474)
      - "7697:7687"  # Bolt Protocol (extern 7697, intern 7687)
    environment:
      - NEO4J_AUTH=neo4j/demo-password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./seed-data.cypher:/var/lib/neo4j/import/seed-data.cypher
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
